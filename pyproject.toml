[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v2g-microgrid-optimization"
version = "1.0.0"
description = "Vehicle-to-Grid Microgrid Optimization using Advanced Algorithms"
authors = [
    {name = "V2G Research Team", email = "research@v2g-optimization.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["optimization", "microgrid", "vehicle-to-grid", "renewable-energy", "IALO"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "pyyaml>=5.4.0",
    "tqdm>=4.62.0",
    "psutil>=5.8.0",
    "joblib>=1.1.0",
    "scikit-learn>=1.0.0",
    "plotly>=5.0.0",
    "openpyxl>=3.0.0",
    "xlsxwriter>=3.0.0",
    "statsmodels>=0.13.0",
    "multiprocessing-logging>=0.3.0",
    "pytest>=6.2.0",
    "pytest-cov>=3.0.0",
    "black>=21.0.0",
    "flake8>=4.0.0",
    "mypy>=0.910",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=3.0.0",
    "black>=21.0.0",
    "flake8>=4.0.0",
    "mypy>=0.910",
    "pre-commit>=2.15.0",
]
visualization = [
    "plotly>=5.0.0",
    "dash>=2.0.0",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[project.scripts]
v2g-optimize = "src.main:main"

[project.urls]
Homepage = "https://github.com/your-repo/v2g-microgrid-optimization"
Repository = "https://github.com/your-repo/v2g-microgrid-optimization.git"
Issues = "https://github.com/your-repo/v2g-microgrid-optimization/issues"
Documentation = "https://v2g-optimization.readthedocs.io/"

# Build configuration - This is the key fix!
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=80"
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "seaborn.*",
    "plotly.*",
    "scipy.*",
    "sklearn.*"
]
ignore_missing_imports = true
