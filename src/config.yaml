# config.yaml - V2G Microgrid Optimization Pipeline Configuration

# System location
location:
  name: "Tripoli, Libya"
  latitude: 32.8872
  longitude: 13.1913
  timezone: "Africa/Tripoli"

# Data file paths
data_paths:
  weather_data_path: "data/weather_data.csv"
  load_data_path: "data/load_data.csv"
  ev_data_path: "data/ev_data.csv"
  economic_parameters_path: "data/economic_parameters.json"

# Component specifications
components:
  pv:
    rated_power: 325
    temp_coefficient: -3.7e-3
    noct: 45
    reference_irradiance: 1000
    reference_temperature: 25
    system_efficiency: 0.95

  wind_turbine:
    rated_power: 5000
    cut_in_speed: 2.5
    cut_out_speed: 40
    rated_speed: 9.5
    hub_height: 70
    reference_height: 43.6
    power_law_exponent: 0.25
    system_efficiency: 0.95

  battery:
    capacity: 35380
    voltage: 48
    soc_min: 0.2
    soc_max: 1.0
    efficiency: 0.85
    inverter_efficiency: 0.95
    converter_efficiency: 0.95
    autonomy_days: 3

  ev:  # <-- main.py expects this key as 'ev'
    capacity: 24000
    soc_min: 0.2
    soc_max: 0.95
    charge_rate: 7.2
    discharge_rate: 7.2
    charging_efficiency: 0.9
    critical_soc_threshold: 0.2


# Optimization parameters
optimization:
  algorithms: ["IALO", "ALO", "PSO", "CSA"]
  default_algorithm: "IALO"
  population_size: 30
  max_iterations: 10
  ialo:
    alpha: 0.01
    beta: 1.5
    elite_ratio: 0.1
    levy_probability: 0.3

# Design variable bounds
bounds:
  n_pv: [10, 100]
  n_wt: [5, 50]
  n_bt: [10, 100]
  autonomy_days: [1, 5]

# Constraint limits
constraints:
  lpsp_max: 0.01
  ref_min: 0.5
  reliability_min: 0.99

# Economic parameters
economic:
  interest_rate: 0.03
  project_lifetime: 20
  grid_buy_price: 0.023
  grid_sell_price: 0.015
  inflation_rate: 0.025
  discount_rate: 0.05
  component_costs:
    pv_panel: 200
    wind_turbine: 2000
    battery: 300
    converter: 150
    inverter: 100
    installation_factor: 0.2
    maintenance_factor: 0.02

# Monte Carlo simulation parameters
monte_carlo:
  num_simulations: 100
  ev_scenarios: [10, 30]
  ev_patterns:
    arrival_time_mean: 18.0
    arrival_time_std: 2.0
    departure_time_mean: 7.0
    departure_time_std: 2.0
    soc_arrival_mean: 0.6
    soc_arrival_std: 0.2
    daily_consumption_mean: 12
    daily_consumption_std: 4

# Sensitivity analysis parameters
sensitivity_analysis:
  parameters:
    solar_irradiance: [0.8, 0.9, 1.0, 1.1, 1.2]
    wind_speed: [0.8, 0.9, 1.0, 1.1, 1.2]
    load_demand: [0.8, 0.9, 1.0, 1.1, 1.2]
    battery_cost: [0.8, 0.9, 1.0, 1.1, 1.2]
    grid_buy_price: [0.8, 0.9, 1.0, 1.1, 1.2]
  output_metrics: ["coe", "lpsp", "ref", "npc"]

# Output directory
output_dir: "outputs/"

# Output and logging
output:
  base_directory: "outputs/"
  subdirectories:
    optimization_results: "optimization_results/"
    figures: "figures/"
    reports: "reports/"
    data: "processed_data/"
  file_formats:
    data: "csv"
    figures: "png"
    reports: "html"
  figure_settings:
    dpi: 300
    format: "png"
    bbox_inches: "tight"

logging:
  level: "INFO"
  log_file: "outputs/pipeline.log"
  console_output: true

# Advanced settings
advanced:
  random_seed: 42
  debug_mode: false

# Multi-objective optimization
multi_objective:
  weights:
    coe: 0.4
    lpsp: 0.3
    ref: 0.3
  scaling:
    lpsp_penalty: 1000
    constraint_penalty: 1000
    balancing_factor: 1.0
